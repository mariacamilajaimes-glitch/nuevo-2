name: Keep Supabase Active

# Los proyectos gratuitos de Supabase se pausan tras varios días sin actividad.
# Este ping diario mantiene la base de datos despierta para que el catálogo y el
# panel de administrador sigan funcionando para todos los visitantes.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API de Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -e
          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/notes?select=name&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase respondió HTTP $status"
          test "$status" -ge 200 -a "$status" -lt 300
